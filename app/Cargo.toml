[package]
name = "circuita"
version = "0.1.0"
edition = "2021"
description = "Circuita — a modern schematic capture and circuit simulation studio"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.32.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
